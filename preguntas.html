<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preguntas 💖</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h1>¡Demuestra que eres mi Valentina! 🤗💝</h1>

        <!-- Pregunta 1 -->
        <p>¿Cuál es mi comida preferida? </p>
        <div class="options">
            <button class="btn" onclick="checkAnswer(this, true)">Sushi 🍣</button>
            <button class="btn" onclick="checkAnswer(this, true)">Kebab 🌯</button>
            <button class="btn" onclick="checkAnswer(this, true)">Arroz 🍚</button>
            <button class="btn" onclick="checkAnswer(this, false)">Pizza 🍕</button>
        </div>

        <!-- Pregunta 2 -->
        <p>¿Cuáles son mis videojuegos favoritos? 🎮</p>
        <div class="options">
            <button class="btn" onclick="checkAnswer(this, true)">Wild Rift</button>
            <button class="btn" onclick="checkAnswer(this, true)">Call of Duty</button>
            <button class="btn" onclick="checkAnswer(this, false)">FIFA</button>
            <button class="btn" onclick="checkAnswer(this, false)">Fortnite</button>
        </div>

        <!-- Pregunta 3 -->
        <p>¿Qué coche tengo? 🚗</p>
        <div class="options">
            <button class="btn" onclick="checkAnswer(this, true)">Opel Mokka</button>
            <button class="btn" onclick="checkAnswer(this, false)">BMW Serie 3</button>
            <button class="btn" onclick="checkAnswer(this, false)">Mercedes Clase A</button>
            <button class="btn" onclick="checkAnswer(this, false)">DMC DeLorean</button>
        </div>

        <button class="btn next" id="nextButton" onclick="nextPage()" style="display:none;">¡Siguiente! 💖</button>
    </div>

    <script>
        let correctAnswers = 0; 
        let incorrectAnswers = 0; 

        function checkAnswer(button, isCorrect) {
            if (button.disabled) return; 

            if (isCorrect) {
                button.classList.add("correct");
                correctAnswers++;
            } else {
                button.classList.add("wrong");
                incorrectAnswers++;
            }

            button.disabled = true;

            if (correctAnswers + incorrectAnswers === 3) {
                document.getElementById("nextButton").style.display = "block";
            }
        }

        function nextPage() {
            let status;
            if (correctAnswers === 3) {
                status = "win";
            } else if (incorrectAnswers === 3) {
                status = "fail";
            } else {
                status = "partial";
            }

            window.location.href = "casiresultado.html?status=" + status;
        }
    </script>

</body>
</html>
