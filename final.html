<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado 💘</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1 id="message"></h1>
        <p id="extra"></p>
        <button onclick="location.href='preguntas.html'">Volver a intentar</button>
    </div>

    <script>
        let params = new URLSearchParams(window.location.search);
        let status = params.get("status");

        if (status === "win") {
            document.getElementById("message").innerText = "¡Felicidades, al parecer sí que me conoces bien! 🎉";
            document.getElementById("extra").innerText = "¡Serás mi Valentina este 14 de febrero 💕!";
        } else if (status === "fail") {
            document.getElementById("message").innerText = "¡Oh no! 😢";
            document.getElementById("extra").innerText = "Has fallado, pero no pasa nada. Así burrita y todo, te quiero y te amo mucho jajaja 😜. ¡Aun así serás mi Valentina x100pre!";
        } else {
            document.getElementById("message").innerText = "¡Casi, casi! 🤭";
            document.getElementById("extra").innerText = "Te faltó poquito, pero igualmente te amo demasiado 💕.";
        }
    </script>
</body>
</html>
