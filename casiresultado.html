<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Quieres saber el resultado? 💖</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #ffccd5, #fff);
            color: #333;
            text-align: center;
            padding: 40px;
        }
        .container {
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            margin: auto;
        }
        h1 {
            color: #d6336c;
            font-size: 2.5em;
        }
        p {
            font-size: 1.5em;
            line-height: 1.6;
        }
        button {
            display: inline-block;
            background: #d6336c;
            color: white;
            padding: 15px 25px;
            font-size: 1.4em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }
        button:hover {
            background: #a22b53;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="frase">¿Seguro que quieres saberlo? 🤔</h1>
        <button id="boton" onclick="cambiarFrase()">Sí, estoy segura 💖</button>
    </div>
    <script>
        const frases = [
            "¿Seguro que quieres saberlo? 🤔",
            "¿Seguro, pero seguro? 🤨",
            "¿Qué tanto estás segura? 😏",
            "¿Y si has fallado? 😱",
            "Bueno... te diré el resultado... 🤭",
            "5️⃣", "4️⃣", "3️⃣", "2️⃣", "1️⃣...", "0️⃣...",
            "¡Ya! 😊",
            "Por cierto, espero que te haya gustado este proyecto 💖. Quiero decirte que te amo mucho, eres el amor de mi vida ❤️❤️❤️. Y por cierto, esto va junto al aniversario 🎉. No sabes cuánto te amo, un montón. Me encanta tu forma de ser, yo también me pregunto por qué te veo tanto, si verte me hace sentir tan bien bonito. Verte, tu 'ser', hace que me anime y es tu forma de ser que me enamora. Tus expresiones, simplemente todo. 😘",
            "Owww 💖"
        ];
        
        const botones = [
            "Sí, estoy segura 💖",
            "Que sí. 😁",
            "Mucho 💪",
            "Siguiente ➡️",
            "Continuar 🔜",
            "Continuar 🔜",
            "Dio'h mio, ¡ayuda UdamEe! 😅",
            "Venga rápido 😜",
            "Meme, qué pesado 😂",
            ".... 🤐",
            "¡Siiiiiuuu! 🎉",
            "Y el resultado? 🤔",
            "Owww 💖"
        ];
        
        let index = 0;
        let status = new URLSearchParams(window.location.search).get("status");

        function cambiarFrase() {
            index++;
            if (index < frases.length) {
                document.getElementById("frase").innerText = frases[index];
                document.getElementById("boton").innerText = botones[index];
            } else {
                window.location.href = "final.html?status=" + status;
            }
        }
    </script>
</body>
</html>
